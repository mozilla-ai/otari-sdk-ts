name: Release

# Independent release automation for this SDK (decoupled from the gateway's own
# releases). release-please watches main: each merged conventional commit
# accumulates into a release PR that bumps the version in package.json and
# updates CHANGELOG.md. Merging that release PR tags the release and creates a
# GitHub Release, and the publish job below ships it to npm in the same run.
#
# The publish job authenticates to npm with OIDC (npm trusted publishing), so no
# npm token is stored here. npm verifies the repository and the workflow filename
# against the trusted publisher configured on the package, then issues a
# credential scoped to the single job. Renaming this file breaks publishing until
# the trusted publisher is updated to match.
#
# Publish runs in this workflow rather than on `release: published` because a
# release created with GITHUB_TOKEN does not trigger further workflow runs.
# Splitting it out would require a PAT, reintroducing the long-lived secret that
# OIDC removes. workflow_dispatch covers the manual case instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for retrying a failed publish (e.g. otari-v0.6.0)"
        required: true

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: release-please
    # On a manual run the release-please job is skipped. A condition without a
    # status function is implicitly ANDed with success(), which a skipped
    # dependency fails, so !cancelled() is required for the dispatch path.
    if: >-
      !cancelled()
      && (needs.release-please.outputs.release_created == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC trusted publishing and npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on the push path, which checks out the commit that triggered
          # the run. release-please has already committed the version bump there.
          ref: ${{ inputs.tag || '' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm 11.5.1 or newer. Node 24 ships a newer
      # npm than that, so fail loudly here rather than on an opaque auth error.
      - name: Verify npm supports trusted publishing
        run: |
          required=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is too old for trusted publishing; need >= $required"
            exit 1
          fi
          echo "npm $actual supports trusted publishing"

      - run: npm ci

      - run: npm run build

      # No NODE_AUTH_TOKEN: npm authenticates via the OIDC token granted by
      # id-token: write above.
      - run: npm publish --provenance --access public
